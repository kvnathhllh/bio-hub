<head>

    <!-- FontAwesome untuk ikon -->

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: radial-gradient(circle at bottom, #1e1b4b 0%, #0f172a 60%, #020617 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px 12px;
            overflow-x: hidden;
            position: relative;
            transition: background 0.5s ease;
        }

        /* Ambient Dynamic Nebula */
        .nebula-glow {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(168, 85, 247, 0.08) 40%, transparent 70%);
            filter: blur(80px);
            pointer-events: none;
            z-index: 1;
            animation: nebulaPulse 10s infinite ease-in-out alternate;
            transition: opacity 0.5s ease;
        }

        @keyframes nebulaPulse {
            0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.9; }
        }

        body.video-active .nebula-glow {
            opacity: 0;
            visibility: hidden;
        }

        /* Background Videos Preloaded */
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            opacity: 0;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
        }

        #bg-video1, #bg-video2 {
            object-fit: cover;
            object-position: center center; 
        }

        .bg-video.active {
            opacity: 1;
        }

        /* Transisi Smooth Blur & Focus Overlay */
        .tv-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            z-index: 999;
            opacity: 0;
            pointer-events: none;
        }

        @keyframes cinematicSwitch {
            0% { opacity: 0; filter: blur(0px); }
            50% { opacity: 1; filter: blur(15px); }
            100% { opacity: 0; filter: blur(0px); }
        }

        .tv-overlay.active {
            animation: cinematicSwitch 0.45s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* Watermark Sumber Video TikTok */
        .watermark {
            margin-top: 10px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 11px;
            color: #94a3b8;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.3s ease;
        }

        .watermark.hidden {
            opacity: 0;
            visibility: hidden;
            max-height: 0;
            margin-top: 0;
            padding: 0;
            border: none;
            overflow: hidden;
            pointer-events: none;
        }

        .watermark i {
            color: #fbbf24;
            font-size: 12px;
        }

        .watermark span {
            color: #f8fafc;
            font-weight: 600;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #020617;
        }
        ::-webkit-scrollbar-thumb {
            background: #fbbf24;
            border-radius: 3px;
        }

        /* Background Stars & Meteor Container */
        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            transition: opacity 0.5s ease;
        }

        body.video-active .stars-container {
            opacity: 0;
            visibility: hidden;
        }

        .star {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
            opacity: var(--opacity);
        }

        @keyframes twinkle {
            0%, 100% { transform: scale(1); opacity: 0.2; }
            50% { transform: scale(1.4); opacity: 1; }
        }

        .dust-particle {
            position: absolute;
            background: rgba(251, 191, 36, 0.6);
            border-radius: 50%;
            pointer-events: none;
            animation: floatUp var(--duration) infinite linear;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        .meteor {
            position: absolute;
            height: 2px;
            background: linear-gradient(90deg, rgba(255, 255, 255, 1), rgba(251, 191, 36, 0.8), transparent);
            border-radius: 999px;
            filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.9));
            animation: shootMeteor linear forwards;
            pointer-events: none;
            opacity: 0;
        }

        @keyframes shootMeteor {
            0% {
                transform: translateX(0) translateY(0) rotate(-38deg);
                opacity: 1;
            }
            100% {
                transform: translateX(-120vw) translateY(90vh) rotate(-38deg);
                opacity: 0;
            }
        }

        .citylight-glow {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80vw;
            height: 100px;
            background: radial-gradient(ellipse at bottom, rgba(245, 158, 11, 0.25) 0%, rgba(14, 165, 233, 0.08) 50%, transparent 100%);
            filter: blur(40px);
            pointer-events: none;
            z-index: 1;
            transition: opacity 0.5s ease;
        }

        body.video-active .citylight-glow {
            opacity: 0;
        }

        /* Container Card */
        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 440px;
            text-align: center;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 24px 20px;
            border-radius: 20px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            transition: background 0.5s ease, border-color 0.5s ease, backdrop-filter 0.5s ease;
        }

        body.video-active .container {
            background: rgba(15, 23, 42, 0.15);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        /* Header Top Controllers */
        .top-controllers {
            position: absolute;
            top: 16px;
            right: 16px;
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .action-icon-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fbbf24;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
        }

        .action-icon-btn:hover {
            transform: scale(1.08);
            background: rgba(245, 158, 11, 0.2);
        }

        /* Music Menu */
        .music-menu {
            position: absolute;
            top: 42px;
            right: 0;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 140px;
            transform-origin: top right;
            transition: all 0.2s ease;
        }

        .music-menu.hidden {
            opacity: 0;
            transform: scale(0.9);
            pointer-events: none;
            visibility: hidden;
        }

        .music-menu button {
            background: transparent;
            border: none;
            color: #f8fafc;
            text-align: left;
            padding: 7px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s, color 0.2s;
        }

        .music-menu button i {
            color: #fbbf24;
            width: 14px;
            text-align: center;
        }

        .music-menu button:hover {
            background: rgba(251, 191, 36, 0.15);
            color: #fbbf24;
        }

        /* CDN Modal / Popup Overlay */
        .cdn-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 6, 23, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .cdn-modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .cdn-modal-card {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.15);
            width: 100%;
            max-width: 400px;
            border-radius: 18px;
            padding: 22px;
            text-align: left;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            transform: scale(0.95);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .cdn-modal-overlay.active .cdn-modal-card {
            transform: scale(1);
        }

        .cdn-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .cdn-modal-header h3 {
            font-size: 16px;
            font-weight: 700;
            color: #f8fafc;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cdn-modal-header h3 i {
            color: #fbbf24;
        }

        .close-modal-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .close-modal-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.4);
        }

        .cdn-form-group {
            margin-bottom: 14px;
        }

        .cdn-form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        .cdn-input, .cdn-file-input-label {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 14px;
            border-radius: 10px;
            color: #f8fafc;
            font-size: 13px;
            outline: none;
            transition: all 0.2s;
        }

        .cdn-input:focus {
            border-color: #fbbf24;
            background: rgba(251, 191, 36, 0.05);
        }

        .cdn-file-input-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            color: #94a3b8;
            border-style: dashed;
        }

        .cdn-file-input-label:hover {
            border-color: #fbbf24;
            color: #fbbf24;
            background: rgba(251, 191, 36, 0.05);
        }

        #file-input {
            display: none;
        }

        .cdn-submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border: none;
            padding: 11px;
            border-radius: 10px;
            color: #0f172a;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 4px;
        }

        .cdn-submit-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
        }

        /* Result Section */
        .cdn-result-box {
            margin-top: 14px;
            background: rgba(2, 6, 23, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 10px;
            border-radius: 10px;
            display: none;
        }

        .cdn-result-box.active {
            display: block;
        }

        .cdn-result-box p {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        .cdn-result-url-wrapper {
            display: flex;
            gap: 6px;
        }

        .cdn-result-url {
            flex-grow: 1;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
            color: #fbbf24;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .cdn-copy-result-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #f8fafc;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s;
        }

        .cdn-copy-result-btn:hover {
            background: #fbbf24;
            color: #0f172a;
        }

        /* Profile & Spinning Animation */
        .profile-img-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 10px;
        }

        .profile-img {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            object-fit: cover;
            border: 2.5px solid #fbbf24;
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.4);
            transition: transform 0.3s ease;
        }

        @keyframes vinylSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .profile-img.spinning {
            animation: vinylSpin 15s linear infinite;
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        p.bio {
            font-size: 13px;
            color: #94a3b8;
            font-weight: 500;
            margin-bottom: 16px;
        }

        /* Links List */
        .links-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 16px;
            border-radius: 12px;
            color: #f8fafc;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .link-btn i {
            font-size: 18px;
            width: 20px;
            height: 18px;
            text-align: center;
            color: #fbbf24;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .link-btn span {
            flex-grow: 1;
            text-align: center;
        }

        .link-btn:hover {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #0f172a;
            border-color: transparent;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
            font-weight: 700;
        }

        .link-btn:hover i {
            color: #0f172a;
        }

        /* Action Buttons */
        .share-btn {
            margin-top: 12px;
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s ease;
        }

        .share-btn:hover {
            color: #fbbf24;
        }

        /* Footer */
        .footer {
            margin-top: 12px;
            font-size: 11px;
            color: #64748b;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- Dynamic Nebula Glow -->
    <div class="nebula-glow"></div>
